# Dependencies of the test environment `discamb`, the same for every image;
# images differ only in how pyDiSCaMB is built into it (BUILD_KIND).
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cctbx-base
  - pybind11
  - llvm-openmp
  - pip
  - scikit-build-core
  - cmake
  - ninja
  - numpy
  - pytest
